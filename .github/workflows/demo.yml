name: Verify and record research demo
on:
  workflow_dispatch:
    inputs:
      demo_url:
        description: Full accessible product URL, including preview parameters
        required: true
        type: string
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test && npm run test:dom
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Record actual product interaction
        env:
          DEMO_URL: ${{ inputs.demo_url }}
        run: node scripts/record-demo.mjs
      - name: Convert to MP4
        if: success()
        run: ffmpeg -y -i demo-artifacts/robot-evidence-demo.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart demo-artifacts/robot-evidence-demo.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-evidence-demo-and-qa
          path: demo-artifacts/
          retention-days: 7
